name: Build Linux AppImage

on:
  push:
    branches: [main, nightly]
    tags:
      - 'v*'

jobs:
  build-linux-appimage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rustflags: "-C linker=clang -C link-arg=-fuse-ld=lld"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang-14 lld libssl-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          sudo ln -sf /usr/bin/clang-14 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-14 /usr/bin/clang++
          
          # Verify pkg-config can find glib-2.0
          pkg-config --modversion glib-2.0

      - name: Install Node dependencies
        run: npm install

      - name: Generate nightly version
        if: github.ref == 'refs/heads/nightly'
        id: nightly_version
        run: |
          git fetch --prune --unshallow
          commits=$(git rev-list --count HEAD)
          version=$(node -e "console.log(require('./package.json').version)")
          new_version="$version-nightly.$commits"
          echo "VERSION=$new_version" >> $GITHUB_OUTPUT
          sed -i "s/\"version\": \"$version\"/\"version\": \"$new_version\"/" package.json
          sed -i "s/\"version\": \"$version\"/\"version\": \"$new_version\"/" src-tauri/tauri.conf.json

      - name: Check TypeScript compilation
        run: npm run check:ts

      - name: Check TypeScript/Svelte types
        run: npm run check:svelte

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Build Tauri app
        run: npm run tauri:build
        env:
          CC: clang
          CXX: clang++
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Locate AppImage
        id: locate
        run: |
          APPIMAGE_PATH=$(find src-tauri/target/release/bundle -name "*.AppImage" -type f | head -1)
          if [ -z "$APPIMAGE_PATH" ]; then
            echo "ERROR: AppImage not found!"
            find src-tauri/target/release/bundle -type f | head -20
            exit 1
          fi
          echo "APPIMAGE_PATH=$APPIMAGE_PATH" >> $GITHUB_OUTPUT
          echo "Found AppImage: $APPIMAGE_PATH"

      - name: Make AppImage executable
        run: chmod +x "${{ steps.locate.outputs.APPIMAGE_PATH }}"

      - name: Rename AppImage with version
        run: |
          cd src-tauri/target/release/bundle/appimage
          APPIMAGE_FILE=$(ls *.AppImage | head -1)
          NEW_NAME="currency-converter-v${{ steps.version.outputs.VERSION }}-x86_64.AppImage"
          mv "$APPIMAGE_FILE" "$NEW_NAME"
          echo "Renamed to: $NEW_NAME"

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: currency-converter-linux-x86_64-appimage
          path: src-tauri/target/release/bundle/appimage/currency-converter-v*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/nightly'
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref == 'refs/heads/nightly' && format('Nightly Build {0}', steps.nightly_version.outputs.VERSION) || github.ref_name }}
          tag_name: ${{ github.ref == 'refs/heads/nightly' && format('nightly-{0}', steps.nightly_version.outputs.VERSION) || github.ref_name }}
          files: src-tauri/target/release/bundle/appimage/currency-converter-v*.AppImage
          draft: false
          prerelease: ${{ github.ref == 'refs/heads/nightly' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Print build summary
        run: |
          echo "✅ Build completed successfully!"
          echo "Platform: Linux x86_64 (AppImage)"
          echo "Version: v${{ steps.version.outputs.VERSION }}"
          echo ""
          echo "📦 Artifacts:"
          ls -lh src-tauri/target/release/bundle/appimage/currency-converter-v*.AppImage
